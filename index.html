<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA // Neural Acoustic Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent: #00f0ff;
      --accent-rgb: 0, 240, 255;
      --bg-dark: #03060c;
      --card-surface: rgba(10, 16, 28, 0.7);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(0, 240, 255, 0.35);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Ambient Canvas Particle Layer */
    #canvas-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Radial Ambient Vignette */
    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(var(--accent-rgb), 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      transition: background 0.8s ease;
    }

    /* Header & Navigation */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 8%;
    }

    .brand {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 4px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-pill {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--accent);
      transition: width 0.3s ease;
      box-shadow: 0 0 8px var(--accent);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .action-btn {
      background: rgba(var(--accent-rgb), 0.08);
      border: 1px solid var(--border-glow);
      color: #fff;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    .action-btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 25px rgba(var(--accent-rgb), 0.5);
      transform: translateY(-2px);
    }

    /* Main Grid Layout */
    .showcase {
      flex: 1;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      align-items: center;
      padding: 0 8% 50px;
      position: relative;
      z-index: 5;
      gap: 60px;
    }

    /* Left Specs Area */
    .content-area {
      max-width: 580px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
    }

      width: 6px;
      height: 6px;
      border-radius
