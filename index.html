<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamVibe // Next-Gen Video Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0c0f17;
      --bg-sidebar: #121722;
      --card-bg: #182030;
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      width: 240px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 10px;
      margin-bottom: 30px;
    }

    .brand span {
      color: var(--accent);
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-item:hover, .nav-item.active {
      background-color: rgba(255, 0, 85, 0.1);
      color: #fff;
    }

    .nav-item.active {
      color: var(--accent);
      border-left: 3px solid var(--accent);
    }

    /* Main Content Wrapper */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }

    /* Top Navigation */
    header {
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(12, 15, 23, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .search-box {
      position: relative;
      width: 420px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 18px 10px 42px;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 25px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: border 0.3s ease;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.6;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--accent), #7928ca);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* Body View Container */
    .content-container {
      padding: 30px;
    }

    /* Main Featured Video Player */
    .player-section {
      margin-bottom: 35px;
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .video-wrapper {
      position: relative;
      padding-top: 42%;
      background: #000;
    }

    .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-details {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #151b29;
    }

    .video-info h2 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .video-info p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    /* Filter Chips */
    .categories {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .chip {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .chip.active, .chip:hover {
      background: #fff;
      color: #000;
    }

    /* Video Feed Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    .video-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .video-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .card-thumb {
      position: relative;
      width: 100%;
      height: 150px;
      background: #252e42;
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.8);
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .card-info {
      padding: 14px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-channel {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @media (max-width: 850px) {
      aside { display: none; }
      .search-box { width: 220px; }
      .video-wrapper { padding-top: 56.25%; }
    }
  </style>
</head>
<body>

  <aside>
    <div>
      <div class="brand">▶ STREAM<span>VIBE</span></div>
      <ul class="nav-list">
        <li class="nav-item active">🏠 Home</li>
        <li class="nav-item">🔥 Trending</li>
        <li class="nav-item">🎮 Gaming</li>
        <li class="nav-item">🎧 Music</li>
        <li class="nav-item">📚 Library</li>
      </ul>
    </div>
    <div style="font-size: 0.75rem; color: var(--text-muted); padding-left: 10px;">
      © 2026 StreamVibe Inc.
    </div>
  </aside>

  <main>
    <header>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search videos, creators..." onkeyup="filterVideos()" />
      </div>
      <div class="user-profile">
        <div class="avatar">M</div>
      </div>
    </header>

    <div class="content-container">
      <section class="player-section">
        <div class="video-wrapper">
          <video id="mainVideo" controls autoplay muted poster="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1200&auto=format&fit=crop&q=80">
            <source id="videoSource" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
          </video>
        </div>
        <div class="video-details">
          <div class="video-info">
            <h2 id="currentTitle">Cinematic Open Source Reel (4K Ultra HD)</h2>
            <p id="currentMeta">Apex Studio • 1.4M views • 2 hours ago</p>
          </div>
          <button class="btn-action">♥ Subscribe</button>
        </div>
      </section>

      <div class="categories">
        <div class="chip active">All Videos</div>
        <div class="chip">Animation</div>
        <div class="chip">Tech & AI</div>
        <div class="chip">Gaming</div>
        <div class="chip">Music</div>
        <div class="chip">Web Dev</div>
      </div>

      <div class="video-grid" id="videoGrid">
        </div>
    </div>
  </main>

  <script>
    const videoList = [
      {
        id: 1,
        title: "Big Buck Bunny Animated Short Movie",
        channel: "Blender Foundation",
        views: "2.4M views",
        time: "3 days ago",
        duration: "09:56",
        src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
        thumb: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 2,
        title: "Elephant Dream Sci-Fi Project",
        channel: "Open Studio",
        views: "850K views",
        time: "1 week ago",
        duration: "10:53",
        src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
        thumb: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 3,
        title: "For Bigger Blazes - Nature Action 4K",
        channel: "Wild Cinematic",
        views: "430K views",
        time: "5 hours ago",
        duration: "00:15",
        src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        thumb: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 4,
        title: "Chromecast Visual Escape Experience",
        channel: "Tech Hub Originals",
        views: "1.1M views",
        time: "2 weeks ago",
        duration: "00:15",
        src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        thumb: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&auto=format&fit=crop&q=80"
      }
    ];

    const grid = document.getElementById("videoGrid");
    const videoPlayer = document.getElementById("mainVideo");
    const videoSource = document.getElementById("videoSource");
    const currentTitle = document.getElementById("currentTitle");
    const currentMeta = document.getElementById("currentMeta");

    function renderCards(list) {
      grid.innerHTML = list.map((item) => `
        <div class="video-card" onclick="playVideo('${item.src}', '${item.title}', '${item.channel}', '${item.views}', '${item.time}')">
          <div class="card-thumb">
            <img src="${item.thumb}" alt="${item.title}">
            <div class="badge-duration">${item.duration}</div>
          </div>
          <div class="card-info">
            <div class="card-title">${item.title}</div>
            <div class="card-channel">${item.channel}</div>
            <div class="card-meta">${item.views} • ${item.time}</div>
          </div>
        </div>
      `).join('');
    }

    function playVideo(src, title, channel, views, time) {
      videoPlayer.src = src;
      videoPlayer.play();
      currentTitle.innerText = title;
      currentMeta.innerText = `${channel} • ${views} • ${time}`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filterVideos() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = videoList.filter(v => 
        v.title.toLowerCase().includes(query) || v.channel.toLowerCase().includes(query)
      );
      renderCards(filtered);
    }

    // Initial render
    renderCards(videoList);
  </script>
</body>
</html>
